[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clear-agent"
version = "2.0.0"
description = "多智能体框架 2.0 GA - StateGraph + RAG + Memory + Multi-agent + MCP + LCEL + Resilience（Retry/Fallback）+ Pydantic Tool 自动推导 + Multimodal + Prompt caching + Eval-harness + 结构化输出"
readme = "README.md"
license = {text = "CC-BY-NC-SA-4.0"}
authors = [
    {name = "Perlou", email = "perloukevin@gmail.com"}
]
requires-python = ">=3.10"
dependencies = [
    # 核心依赖
    "openai>=1.0.0,<2.0.0",
    "requests>=2.25.0,<3.0.0",
    "python-dotenv>=0.19.0,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "numpy>=2.0.0,<3.0.0",
    "networkx>=2.6.0,<4.0.0",
    "tiktoken>=0.5.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0.0"]
anthropic = ["anthropic>=0.20.0"]
# 2.0 新增：检索 / RAG / Memory（按需安装）
retrieval = [
    "scikit-learn>=1.0.0",  # TFIDFEmbedding 兜底 + WorkingMemory.retrieve TF-IDF
]
retrieval-qdrant = [
    "qdrant-client>=1.6.0",  # QdrantVectorStore
]
rag = [
    "sentence-transformers>=2.2.0",   # local embedding + cross-encoder rerank
    "transformers>=4.20.0",
    "torch>=1.12.0",
    "markitdown>=0.0.1",              # 通用文档加载（PDF/DOCX/XLSX/...）
    "langdetect>=1.0.9",              # 语言检测
]
memory = [
    "scikit-learn>=1.0.0",   # WorkingMemory TF-IDF 检索
    "spacy>=3.4.0",          # SemanticMemory NER（中英文）
]
mcp = [
    "mcp>=1.0.0",            # 官方 MCP SDK（Python）
]
dashscope = [
    "dashscope>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/Perlou/clear-agent"
Documentation = "https://github.com/Perlou/clear-agent/blob/main/README.md"
Repository = "https://github.com/Perlou/clear-agent"
"Bug Tracker" = "https://github.com/Perlou/clear-agent/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["clear_agent*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.setuptools.package-data]
clear_agent = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
