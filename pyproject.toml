[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clear-agent"
version = "2.0.0"
description = "Lightweight composable multi-agent framework with StateGraph, RAG, Memory, MCP, and structured output"
readme = "README.md"
license = {text = "CC-BY-NC-SA-4.0"}
authors = [
    {name = "Perlou", email = "perloukevin@gmail.com"}
]
maintainers = [
    {name = "Perlou", email = "perloukevin@gmail.com"}
]
requires-python = ">=3.10"
keywords = [
    "agent", "multi-agent", "llm", "ai", "openai", "anthropic", "gemini",
    "rag", "memory", "mcp", "stategraph", "checkpoint", "hitl",
    "structured-output", "function-calling", "lcel", "eval",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "openai>=1.0.0,<2.0.0",
    "requests>=2.25.0,<3.0.0",
    "python-dotenv>=0.19.0,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "numpy>=2.0.0,<3.0.0",
    "networkx>=2.6.0,<4.0.0",
    "tiktoken>=0.5.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
# 多 provider 适配
anthropic = ["anthropic>=0.20.0"]
gemini = ["google-genai>=1.0.0"]
dashscope = ["dashscope>=1.10.0"]

# 检索 / RAG / Memory
retrieval = ["scikit-learn>=1.0.0"]
retrieval-qdrant = ["qdrant-client>=1.6.0"]
rag = [
    "sentence-transformers>=2.2.0",
    "transformers>=4.20.0",
    "torch>=1.12.0",
    "markitdown>=0.0.1",
    "langdetect>=1.0.9",
]
memory = [
    "scikit-learn>=1.0.0",
    "spacy>=3.4.0",
]

# 协议集成
mcp = ["mcp>=1.0.0"]

# 一键全套（用于完整能力体验）
all = [
    "anthropic>=0.20.0",
    "google-genai>=1.0.0",
    "dashscope>=1.10.0",
    "scikit-learn>=1.0.0",
    "qdrant-client>=1.6.0",
    "sentence-transformers>=2.2.0",
    "transformers>=4.20.0",
    "torch>=1.12.0",
    "markitdown>=0.0.1",
    "langdetect>=1.0.9",
    "spacy>=3.4.0",
    "mcp>=1.0.0",
]

# 开发依赖
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/Perlou/clear-agent"
Documentation = "https://github.com/Perlou/clear-agent/tree/main/docs"
Repository = "https://github.com/Perlou/clear-agent"
"Bug Tracker" = "https://github.com/Perlou/clear-agent/issues"
Changelog = "https://github.com/Perlou/clear-agent/releases"

[tool.setuptools.packages.find]
where = ["."]
include = ["clear_agent*"]
exclude = ["tests*", "examples*", "docs*", "skills*"]

[tool.setuptools.package-data]
clear_agent = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
